<!-- Modal trigger button -->
<button
    type="button"
    class="btn btn-primary btn-lg"
    data-bs-toggle="modal"
    data-bs-target="#modalId"
>
    Launch
</button>

<!-- Modal Body -->
<!-- if you want to close by clicking outside the modal, delete the last endpoint:data-bs-backdrop and data-bs-keyboard -->
<div
    class="modal fade"
    id="modalId"
    tabindex="-1"
    data-bs-backdrop="static"
    data-bs-keyboard="false"
    
    role="dialog"
    aria-labelledby="modalTitleId"
    aria-hidden="true"
>
    <div
        class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-sm"
        role="document"
    >
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitleId">
                    Registro para el administrador
                </h5>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>
            <div class="modal-body">
                <div class="container"><form action="" method="post" id="formRegistroadmin" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="nombre_coordinador">Nombre del Coordinador</label>
                        <input type="text" class="form-control" name="nombre_coordinador" id="nombre_coordinador" aria-describedby="helpId" placeholder="Nombre completo del coordinador">
                    </div>
                    <div class="form-group">
                        <label for="apellido_paterno">Apellido Paterno</label>
                        <input type="text" class="form-control" name="apellido_paterno" id="apellido_paterno" aria-describedby="helpId" placeholder="Apellido paterno del coordinador">
                    </div>
                    <div class="form-group">
                        <label for="apellido_materno">Apellido materno</label>
                        <input type="text" class="form-control" name="apellido_materno" id="apellido_materno" aria-describedby="helpId" placeholder="Apellido materno del coordinador">
                    </div>
                    <div class="form-group">
                        <label for="numero_empleado">Numero de empleado</label>
                        <input type="text" class="form-control" name="numero_empleado" id="numero_empleado" aria-describedby="helpId" placeholder="Numero de empleado del coordinador">
                    </div>
                    <div class="form-group">
                        <label for="password_coordinador">Contraseña</label>
                        <input type="password" class="form-control" name="password_coordinador" id="password_coordinador" aria-describedby="helpId" placeholder="Contraseña del coordinador">
                    </div>
                    <div class="form-group">
                        <label for="ues">Unidad de Estudios Superiores</label>
                        <select name="ues" id="ues">
                            <option value="">Selecciona una UES</option>
                            <option value="1">UMB San José del Rincón</option>
                        </select>
                    </div>
                </form>
            </div>
        </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cerrar
                </button>
                <button type="button" class="btn btn-primary">Registrar</button>
            </div>
        </div>
    </div>
</div>

<!-- Optional: Place to the bottom of scripts -->
<script>
    const myModal = new bootstrap.Modal(
        document.getElementById("modalId"),
        options,
    );
</script>
